# Temporaire : regarder le format des archives ACCO (accords d'entreprise) de la DILA avant d'écrire leur lecture.
# À supprimer une fois le connecteur écrit.
name: Explorer ACCO

on:
  pull_request:
    paths:
      - .github/workflows/explorer-acco.yml

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Liste des archives
        run: |
          curl -sSL https://echanges.dila.gouv.fr/OPENDATA/ACCO/ -o list.html
          grep -oE 'href="[^"]+"' list.html | sed 's/href="//;s/"$//' | tail -40
          grep -oE '[0-9]{2}-[A-Za-z]{3}-[0-9]{4} [0-9:]+ +[0-9.]+[KMG]?' list.html | tail -10 || true
          sed 's/<[^>]*>/ /g' list.html | grep -E 'tar|gz|xml' | tail -40
      - name: Une archive récente
        run: |
          last=$(grep -oE 'href="ACCO_[^"]+\.tar\.gz"' list.html | sed 's/href="//;s/"$//' | sort | tail -1)
          echo "archive: $last"
          curl -sSL "https://echanges.dila.gouv.fr/OPENDATA/ACCO/$last" -o a.tar.gz
          ls -la a.tar.gz
          mkdir x && tar xzf a.tar.gz -C x
          find x -type f | head -30
          echo "--- extensions"
          find x -type f | sed 's/.*\.//' | sort | uniq -c
          echo "--- un XML"
          f=$(find x -type f -name '*.xml' | head -1); echo "$f"; head -c 6000 "$f"
          echo; echo "--- XML qui parlent d'apprenti"
          grep -ril 'apprenti' x | head -10
          g=$(grep -ril 'apprenti' x --include='*.xml' | head -1); [ -n "$g" ] && head -c 6000 "$g"
          echo; echo "--- autres fichiers à côté"
          d=$(dirname "$f"); ls -la "$d" | head
