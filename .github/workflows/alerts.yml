# Alertes « nouvelles offres » : chaque matin, pour tout le monde (gratuit).
# Secrets à créer dans Settings → Secrets and variables → Actions :
# DATABASE_URL, RESEND_API_KEY, EMAIL_FROM, BREVO_API_KEY (pour les SMS),
# FRANCE_TRAVAIL_CLIENT_ID, FRANCE_TRAVAIL_CLIENT_SECRET, NEXT_PUBLIC_SITE_URL.
name: Alertes

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Alertes
        if: ${{ env.DATABASE_URL != '' && env.RESEND_API_KEY != '' }}
        run: pnpm alerts
