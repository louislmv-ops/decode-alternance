# Collecte quotidienne des offres, chaque nuit : toute La bonne alternance (15 à 30 minutes), France Travail
# si ses identifiants sont là, et les sites carrière renseignés. Elle tourne sur GitHub Actions plutôt qu'en
# cron Vercel : le plan Hobby de Vercel limite les fonctions à quelques minutes.
# Secrets à créer dans Settings → Secrets and variables → Actions :
# DATABASE_URL et LBA_API_TOKEN (indispensables) ; FRANCE_TRAVAIL_CLIENT_ID, FRANCE_TRAVAIL_CLIENT_SECRET, BOT_CONTACT (facultatifs).
# Premier lancement à la main : onglet Actions → « Collecte des offres » → Run workflow.
name: Collecte des offres

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LBA_API_TOKEN: ${{ secrets.LBA_API_TOKEN }}
      FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
      BOT_CONTACT: ${{ secrets.BOT_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collecte
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm ingest
